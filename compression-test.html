<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compression Performance Test</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        
        .stat-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            border-left: 4px solid #2d7d32;
        }
        
        .stat-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 600;
            color: #2d7d32;
        }
        
        .test-results {
            margin-top: 30px;
            padding: 20px;
            background: #e8f5e8;
            border-radius: 8px;
        }
        
        .btn {
            background: #2d7d32;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
            transition: all 0.2s;
        }
        
        .btn:hover {
            background: #1b5e20;
            transform: translateY(-1px);
        }
        
        .progress {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            margin: 20px 0;
        }
        
        .progress-bar {
            height: 100%;
            background: #2d7d32;
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .log {
            background: #263238;
            color: #4caf50;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
        }
        
        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .comparison-table th,
        .comparison-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        .comparison-table th {
            background: #f5f5f5;
            font-weight: 600;
        }
        
        .savings {
            color: #2d7d32;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗜️ Compression Performance Test</h1>
            <p>Testing compression benefits for Quran Word by Word application</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Original Data Size</div>
                <div class="stat-value" id="originalSize">31.84 MB</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Compressed Size</div>
                <div class="stat-value" id="compressedSize">4.17 MB</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Space Saved</div>
                <div class="stat-value savings" id="spaceSaved">86.9%</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Network Transfer Reduction</div>
                <div class="stat-value savings" id="transferReduction">27.67 MB</div>
            </div>
        </div>

        <div style="text-align: center;">
            <button class="btn" onclick="runPerformanceTest()">🚀 Run Live Performance Test</button>
            <button class="btn" onclick="testCachePerformance()">💾 Test Cache Performance</button>
            <button class="btn" onclick="clearTestCache()">🗑️ Clear Test Cache</button>
        </div>

        <div class="progress" id="progressContainer" style="display: none;">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="test-results" id="testResults" style="display: none;">
            <h3>📊 Live Test Results</h3>
            <table class="comparison-table" id="resultsTable">
                <thead>
                    <tr>
                        <th>Method</th>
                        <th>Load Time</th>
                        <th>Data Size</th>
                        <th>Cache Hit</th>
                        <th>Performance</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="log" id="testLog" style="display: none;"></div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="compression-utils.js"></script>
    <script src="enhanced-data-loader.js"></script>

    <script>
        let testLog = [];
        let compressor, enhancedLoader;

        // Initialize compression system
        function initCompressionTest() {
            try {
                compressor = new DataCompressor();
                enhancedLoader = new EnhancedDataLoader();
                enhancedLoader.init();
                
                log('✅ Compression system initialized');
                return true;
            } catch (error) {
                log('❌ Failed to initialize compression system: ' + error.message);
                return false;
            }
        }

        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            testLog.push(`[${timestamp}] ${message}`);
            
            const logElement = document.getElementById('testLog');
            logElement.style.display = 'block';
            logElement.innerHTML = testLog.join('\\n');
            logElement.scrollTop = logElement.scrollHeight;
            
            console.log(message);
        }

        function updateProgress(percent) {
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            
            progressContainer.style.display = 'block';
            progressBar.style.width = percent + '%';
            
            if (percent >= 100) {
                setTimeout(() => {
                    progressContainer.style.display = 'none';
                }, 1000);
            }
        }

        function addTestResult(method, loadTime, dataSize, cacheHit, performance) {
            const resultsTable = document.getElementById('resultsTable').getElementsByTagName('tbody')[0];
            const testResults = document.getElementById('testResults');
            
            testResults.style.display = 'block';
            
            const row = resultsTable.insertRow();
            row.innerHTML = `
                <td>${method}</td>
                <td>${loadTime}ms</td>
                <td>${formatBytes(dataSize)}</td>
                <td>${cacheHit ? '✅' : '❌'}</td>
                <td class="${performance === 'Fast' ? 'savings' : ''}">${performance}</td>
            `;
        }

        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        async function runPerformanceTest() {
            if (!initCompressionTest()) {
                return;
            }

            log('🧪 Starting performance test...');
            updateProgress(10);

            // Clear previous results
            const tbody = document.getElementById('resultsTable').getElementsByTagName('tbody')[0];
            tbody.innerHTML = '';

            try {
                // Test 1: Load surah names
                log('📚 Testing surah names loading...');
                updateProgress(25);
                
                const startTime1 = performance.now();
                const surahNames = await enhancedLoader.loadSurahNames();
                const loadTime1 = Math.round(performance.now() - startTime1);
                
                addTestResult(
                    'Surah Names',
                    loadTime1,
                    JSON.stringify(surahNames).length,
                    false,
                    loadTime1 < 100 ? 'Fast' : 'Slow'
                );
                
                log(`✅ Surah names loaded in ${loadTime1}ms`);
                updateProgress(50);

                // Test 2: Load a small surah (Al-Fatihah)
                log('📖 Testing small surah loading (Al-Fatihah)...');
                
                const startTime2 = performance.now();
                const smallSurah = await enhancedLoader.loadSurahData(1);
                const loadTime2 = Math.round(performance.now() - startTime2);
                
                addTestResult(
                    'Small Surah (Al-Fatihah)',
                    loadTime2,
                    JSON.stringify(smallSurah).length,
                    false,
                    loadTime2 < 50 ? 'Fast' : 'Slow'
                );
                
                log(`✅ Small surah loaded in ${loadTime2}ms`);
                updateProgress(75);

                // Test 3: Load a large surah (Al-Baqarah)
                log('📖 Testing large surah loading (Al-Baqarah)...');
                
                const startTime3 = performance.now();
                const largeSurah = await enhancedLoader.loadSurahData(2);
                const loadTime3 = Math.round(performance.now() - startTime3);
                
                addTestResult(
                    'Large Surah (Al-Baqarah)',
                    loadTime3,
                    JSON.stringify(largeSurah).length,
                    false,
                    loadTime3 < 200 ? 'Fast' : 'Slow'
                );
                
                log(`✅ Large surah loaded in ${loadTime3}ms`);
                updateProgress(100);

                // Summary
                const avgLoadTime = Math.round((loadTime1 + loadTime2 + loadTime3) / 3);
                log(`🎉 Performance test completed! Average load time: ${avgLoadTime}ms`);
                
                // Show cache stats
                const cacheStats = enhancedLoader.getCacheStats();
                log(`💾 Cache: ${cacheStats.count} items, ${cacheStats.size}`);

            } catch (error) {
                log('❌ Performance test failed: ' + error.message);
                updateProgress(100);
            }
        }

        async function testCachePerformance() {
            if (!initCompressionTest()) {
                return;
            }

            log('💾 Testing cache performance...');
            
            try {
                // First load (no cache)
                const startTime1 = performance.now();
                await enhancedLoader.loadSurahData(36); // Ya-Sin
                const firstLoadTime = Math.round(performance.now() - startTime1);
                
                log(`📊 First load (no cache): ${firstLoadTime}ms`);
                
                // Second load (from cache)
                const startTime2 = performance.now();
                await enhancedLoader.loadSurahData(36); // Ya-Sin again
                const cachedLoadTime = Math.round(performance.now() - startTime2);
                
                log(`📊 Cached load: ${cachedLoadTime}ms`);
                
                const speedImprovement = Math.round(((firstLoadTime - cachedLoadTime) / firstLoadTime) * 100);
                log(`🚀 Cache performance improvement: ${speedImprovement}%`);
                
                addTestResult(
                    'Cache Test (Ya-Sin)',
                    cachedLoadTime,
                    0,
                    true,
                    speedImprovement > 80 ? 'Excellent' : 'Good'
                );

            } catch (error) {
                log('❌ Cache test failed: ' + error.message);
            }
        }

        function clearTestCache() {
            if (enhancedLoader) {
                const cleared = enhancedLoader.clearCache();
                if (cleared) {
                    log('🗑️ Test cache cleared successfully');
                } else {
                    log('❌ Failed to clear cache');
                }
            } else {
                log('⚠️ Enhanced loader not initialized');
            }
        }

        // Initialize on page load
        window.addEventListener('load', () => {
            log('🔧 Compression test page loaded');
            log('💡 Click "Run Live Performance Test" to see compression benefits!');
        });
    </script>
</body>
</html>
